<text x="50" y="64" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#0f172a" font-weight="bold" text-anchor="start" style="">LLM Cost &amp; Performance Optimization</text>
<text x="50" y="94" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" style="">Profile first, fix the real bottleneck — production-ready and scalable, without a rewrite</text>
<rect x="50" y="160" width="330" height="160" rx="12" ry="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="50" y="160" width="6" height="160" rx="3" fill="#b91c1c"/><text x="70" y="190" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Symptom</text><text x="70" y="214" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Model call is fast alone,</text><text x="70" y="235" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">but the full pipeline is slow.</text><text x="70" y="256" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">So the model isn&#x27;t the problem</text><rect x="430" y="160" width="340" height="160" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="430" y="160" width="6" height="160" rx="3" fill="#4f46e5"/><text x="450" y="190" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Instrument every stage</text><text x="450" y="214" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Real timings: discovery, OCR,</text><text x="450" y="235" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">prompt prep, model call, parse,</text><text x="450" y="256" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">DB write — measure, don&#x27;t assume</text><rect x="820" y="160" width="340" height="160" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="820" y="160" width="6" height="160" rx="3" fill="#0d9488"/><text x="840" y="190" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Find the bottleneck</text><text x="840" y="214" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Model reload (keep_alive unset),</text><text x="840" y="235" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">serial vs concurrent, GPU/VRAM</text><text x="840" y="256" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">thrash, DB and I/O waits</text><rect x="1210" y="160" width="340" height="160" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="1210" y="160" width="6" height="160" rx="3" fill="#15803d"/><text x="1230" y="190" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Targeted fixes</text><text x="1230" y="214" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">keep_alive, batching, async</text><text x="1230" y="235" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">concurrency, caching, right-</text><text x="1230" y="256" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">sizing — not a rewrite</text><rect x="430" y="470" width="520" height="170" rx="12" ry="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><rect x="430" y="470" width="6" height="170" rx="3" fill="#334155"/><text x="450" y="500" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Before</text><text x="450" y="524" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">One PDF at a time, model reloaded</text><text x="450" y="545" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">each call, GPU idle between requests</text><rect x="1030" y="470" width="520" height="170" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="1030" y="470" width="6" height="170" rx="3" fill="#15803d"/><text x="1050" y="500" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">After</text><text x="1050" y="524" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Concurrent, model resident, stages</text><text x="1050" y="545" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">pipelined — same output, a fraction</text><text x="1050" y="566" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">of the wall-clock</text><line x1="380" y1="240" x2="430" y2="240" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="770" y1="240" x2="820" y2="240" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1160" y1="240" x2="1210" y2="240" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="950" y1="555" x2="1030" y2="555" stroke="#15803d" stroke-width="2.2" marker-end="url(#ah)" /><rect x="917.0" y="533.0" width="146.0" height="20" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="990.0" y="547.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="11.5" fill="#15803d" font-weight="bold" text-anchor="middle" style="">measured, then fixed</text>
