<rect x="50" y="180" width="300" height="170" rx="12" ry="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><rect x="50" y="180" width="6" height="170" rx="3" fill="#334155"/><text x="70" y="210" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">MCP clients</text><text x="70" y="234" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">ChatGPT, Claude, Cursor,</text><text x="70" y="255" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">any MCP-compatible client.</text><text x="70" y="276" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Connect over the spec —</text><text x="70" y="297" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">no per-client glue</text><rect x="430" y="150" width="360" height="230" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="430" y="150" width="6" height="230" rx="3" fill="#4f46e5"/><text x="450" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">MCP Server (FastMCP / Python)</text><text x="450" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Business operations exposed</text><text x="450" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">as a few well-named tools,</text><text x="450" y="246" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">not a 1:1 REST mirror</text><rect x="430" y="410" width="360" height="150" rx="12" ry="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="430" y="410" width="6" height="150" rx="3" fill="#b91c1c"/><text x="450" y="440" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Auth — deny by default</text><text x="450" y="464" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">JWT → tenant + scope on every</text><text x="450" y="485" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">call. Read vs write scopes differ</text><rect x="870" y="180" width="320" height="150" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="870" y="180" width="6" height="150" rx="3" fill="#0d9488"/><text x="890" y="210" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Tools</text><text x="890" y="234" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">list_* (invoices:read)</text><text x="890" y="255" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">mark_* (invoices:write)</text><text x="890" y="276" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Model args validated</text><rect x="870" y="370" width="320" height="150" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="870" y="370" width="6" height="150" rx="3" fill="#15803d"/><text x="890" y="400" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Postgres — tenant-filtered</text><text x="890" y="424" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Every query WHERE tenant_id.</text><text x="890" y="445" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Tenant A can never read B.</text><text x="890" y="466" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Writes are idempotent</text><rect x="1270" y="180" width="280" height="150" rx="12" ry="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><rect x="1270" y="180" width="6" height="150" rx="3" fill="#334155"/><text x="1290" y="210" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Docker → AWS</text><text x="1290" y="234" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">ECS Fargate behind ALB,</text><text x="1290" y="255" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">RDS, Secrets Manager,</text><text x="1290" y="276" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">CloudWatch logs</text><rect x="1270" y="370" width="280" height="150" rx="12" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="1270" y="370" width="6" height="150" rx="3" fill="#b45309"/><text x="1290" y="400" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Read-only 