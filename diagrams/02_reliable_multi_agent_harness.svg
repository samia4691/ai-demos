<text x="50" y="64" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Reliable Multi-Agent Harness</text>
<text x="50" y="94" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" style="">One codebase, N agents — adding an agent is configuration, not new code</text>
<rect x="50" y="150" width="320" height="160" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="50" y="150" width="6" height="160" rx="3" fill="#4f46e5"/><text x="70" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Config-defined agents</text><text x="70" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Each agent = prompt + doc set +</text><text x="70" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">tools + output schema, in YAML.</text><text x="70" y="246" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Agent #11 is a config, not a commit</text><rect x="470" y="140" width="660" height="470" rx="12" ry="12" fill="#ffffff" stroke="#334155" stroke-width="2"/><rect x="470" y="140" width="6" height="470" rx="3" fill="#334155"/><text x="490" y="170" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Shared Harness (owns the loop)</text><rect x="500" y="200" width="280" height="120" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="500" y="200" width="6" height="120" rx="3" fill="#4f46e5"/><text x="520" y="230" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Provider abstraction</text><text x="520" y="254" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Swap the model without</text><text x="520" y="275" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">a rewrite</text><rect x="820" y="200" width="280" height="120" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="820" y="200" width="6" height="120" rx="3" fill="#4f46e5"/><text x="840" y="230" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Model-call loop</text><text x="840" y="254" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Retries, timeouts, rate-limit</text><text x="840" y="275" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">backoff, token accounting</text><rect x="500" y="350" width="280" height="120" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="500" y="350" width="6" height="120" rx="3" fill="#0d9488"/><text x="520" y="380" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Schema validation</text><text x="520" y="404" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Validate every output; feed the</text><text x="520" y="425" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">error back + bounded repair</text><rect x="820" y="350" width="280" height="120" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="820" y="350" width="6" height="120" rx="3" fill="#0d9488"/><text x="840" y="380" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Router + termination</text><text x="840" y="404" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Only routes to named agents;</text><text x="840" y="425" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">hard step/token limits stop loops</text><rect x="500" y="485" width="600" height="105" rx="12" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="500" y="485" width="6" height="105" rx="3" fill="#b45309"/><text x="520" y="515" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Run logging + eval harness</text><text x="520" y="539" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Every run traced and reproducible; a change is tested against known-good cases before ship</text><rect x="1230" y="200" width="320" height="150" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="1230" y="200" width="6" height="150" rx="3" fill="#15803d"/><text x="1250" y="230" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Tool registry</text><text x="1250" y="254" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Config references tools by name.</text><text x="1250" y="275" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">New tool = register + one config</text><text x="1250" y="296" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">line, never a harness edit</text><rect x="1230" y="410" width="320" height="150" rx="12" ry="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="1230" y="410" width="6" height="150" rx="3" fill="#b91c1c"/><text x="1250" y="440" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Fixes the symptoms</text><text x="1250" y="464" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Loops, bad handoffs, silent tool</text><text x="1250" y="485" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">failures, token bloat, no tracing</text><line x1="370" y1="230" x2="470" y2="300" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1130" y1="270" x2="1230" y2="270" stroke="#15803d" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1130" y1="470" x2="1230" y2="470" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="1140.0" y="448.0" width="80.0" height="20" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/><text x="1180.0" y="462.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold" text-anchor="middle" style="">eliminates</text>
