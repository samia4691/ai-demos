al, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Cheapest config that clears the</text><text x="1180" y="435" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">quality bar — counting retries</text><text x="1180" y="456" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">on schema failures</text><rect x="600" y="560" width="520" height="150" rx="12" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="600" y="560" width="6" height="150" rx="3" fill="#b45309"/><text x="620" y="590" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Regression Gate</text><text x="620" y="614" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Re-run on every prompt / model / ingest change.</text><text x="620" y="635" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Blocks the deploy when quality drifts down</text><rect x="50" y="360" width="300" height="150" rx="12" ry="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="50" y="360" width="6" height="150" rx="3" fill="#b91c1c"/><text x="70" y="390" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Why it matters</text><text x="70" y="414" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">A fluent wrong answer costs</text><text x="70" y="435" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">more than a slow right one.</text><text x="70" y="456" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Measure, don&#x27;t vibe</text><line x1="350" y1="235" x2="400" y2="235" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="700" y1="235" x2="750" y2="235" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1110" y1="235" x2="1160" y2="235" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1355" y1="310" x2="1355" y2="360" stroke="#15803d" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1160" y1="470" x2="1120" y2="560" stroke="#b45309" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 5"/>
