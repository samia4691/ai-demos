<text x="50" y="94" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" style="">Retrieval that refuses to guess — the fix for confident-but-wrong document assistants</text>
<rect x="50" y="150" width="300" height="150" rx="12" ry="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><rect x="50" y="150" width="6" height="150" rx="3" fill="#334155"/><text x="70" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Documents</text><text x="70" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">PDF, DOCX, HTML</text><text x="70" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">8+ years of specs,</text><text x="70" y="246" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">contracts, procedures</text><rect x="400" y="150" width="300" height="150" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="400" y="150" width="6" height="150" rx="3" fill="#4f46e5"/><text x="420" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Ingestion</text><text x="420" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Chunk + carry provenance;</text><text x="420" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">doc_id + page ride with</text><text x="420" y="246" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">every chunk</text><rect x="750" y="150" width="300" height="150" rx="12" ry="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="750" y="150" width="6" height="150" rx="3" fill="#4f46e5"/><text x="770" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Embed + Index</text><text x="770" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Vector store (pgvector /</text><text x="770" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">OpenSearch on your AWS)</text><rect x="1150" y="150" width="400" height="150" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="1150" y="150" width="6" height="150" rx="3" fill="#0d9488"/><text x="1170" y="180" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Retrieve — with a SCORE FLOOR</text><text x="1170" y="204" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Top-k, then drop anything below</text><text x="1170" y="225" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">the bar. Nothing good enough =</text><text x="1170" y="246" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">return nothing, not a guess</text><rect x="1150" y="360" width="400" height="150" rx="12" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="1150" y="360" width="6" height="150" rx="3" fill="#15803d"/><text x="1170" y="390" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Grounded Answer</text><text x="1170" y="414" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Every sentence cites doc + page.</text><text x="1170" y="435" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">No citation, no answer —</text><text x="1170" y="456" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">enforced in code, not prompted</text><rect x="600" y="560" width="500" height="150" rx="12" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="600" y="560" width="6" height="150" rx="3" fill="#b45309"/><text x="620" y="590" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Correctness Eval + Regression Gate</text><text x="620" y="614" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Gold set scores answer accuracy AND</text><text x="620" y="635" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">citation validity separately. Re-runs after</text><text x="620" y="656" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">every ingest; blocks on quality drop</text><rect x="50" y="360" width="300" height="150" rx="12" ry="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="50" y="360" width="6" height="150" rx="3" fill="#b91c1c"/><text x="70" y="390" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start" style="">The real problem</text><text x="70" y="414" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">&quot;Answers confidently and</text><text x="70" y="435" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">is sometimes wrong.&quot;</text><text x="70" y="456" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">That is plumbing, not the model</text><line x1="350" y1="225" x2="400" y2="225" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="700" y1="225" x2="750" y2="225" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1050" y1="225" x2="1150" y2="225" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)" /><line x1="1350" y1="300" x2="1350" y2="360" stroke="#0d9488" stroke-width="2.2" marker-end="url(#ah)" /><rect x="1280.3" y="308.0" width="139.39999999999998" height="20" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1"/><text x="1350.0" y="322.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="11.5" fill="#0d9488" font-weight="bold" text-anchor="middle" style="">only cited passages</text><line x1="1150" y1="470" x2="1100" y2="560" stroke="#b45309" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="1101.5" y="493.0" width="47.0" height="20" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="1125.0" y="507.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle" style="">score</text><line x1="600" y1="620" x2="350" y2="470" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="441.6" y="523.0" width="66.8" height="20" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/><text x="475.0" y="537.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="bold" text-anchor="middle" style="">prevents</text>
