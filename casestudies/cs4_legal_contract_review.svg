<rect x="50" y="160" width="700" height="255" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="50" y="160" width="6" height="255" rx="3" fill="#b91c1c"/><text x="68" y="188" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" style="">The challenge</text><text x="68" y="212" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">Associates spend hours hunting clauses across long contracts.</text><text x="68" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">A naive AI assistant answers confidently and is sometimes</text><text x="68" y="252" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">wrong — which in legal work is worse than no answer at all.</text><text x="68" y="272" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style=""></text><text x="68" y="292" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">Every answer must be traceable to the source clause.</text><rect x="790" y="160" width="235" height="100" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="907.5" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#15803d" font-weight="bold" text-anchor="middle" style="">-65%</text><text x="907.5" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">clause-review time</text><rect x="1045" y="160" width="235" height="100" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="1162.5" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#0d9488" font-weight="bold" text-anchor="middle" style="">100%</text><text x="1162.5" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">answers cite a source</text><rect x="1300" y="160" width="250" height="100" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="1425.0" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#4f46e5" font-weight="bold" text-anchor="middle" style="">0</text><text x="1425.0" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">uncited answers shown</text><text x="790" y="290" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Time to review a contract</text><text x="790" y="328" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Before</text><rect x="910" y="312" width="620.0" height="24" rx="5" fill="#b91c1c"/><text x="1540.0" y="329" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" style="">100 min</text><text x="790" y="364" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">After</text><rect x="910" y="348" width="217.0" height="24" rx="5" fill="#15803d"/><text x="1137.0" y="365" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" style="">35 min</text><text x="50" y="450" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Solution architecture</text><rect x="50.0" y="470" width="356.25" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/><text x="228.125" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Contracts</text><rect x="431.25" y="470" width="356.25" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/><text x="609.375" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Chunk + provenance</text><rect x="812.5" y="470" width="356.25" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/><text x="990.625" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Retrieval w/ score floor</text><rect x="1193.75" y="470" width="356.25" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/><text x="1371.875" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Cited answers + gold-set eval</text><line x1="406.25" y1="530" x2="431.25" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/><line x1="787.5" y1="530" x2="812.5" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1168.75" y1="530" x2="1193.75" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/>
