<rect x="50" y="160" width="700" height="255" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><rect x="50" y="160" width="6" height="255" rx="3" fill="#b91c1c"/><text x="68" y="188" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start" style="">The challenge</text><text x="68" y="212" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">Lending ops key bank statements and tax docs by hand.</text><text x="68" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">Errors are expensive and slow underwriting — but nobody</text><text x="68" y="252" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">trusts automation without proof the numbers are right.</text><text x="68" y="272" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style=""></text><text x="68" y="292" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="start" style="">So accuracy has to be measured, not assumed.</text><rect x="790" y="160" width="235" height="100" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="907.5" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#15803d" font-weight="bold" text-anchor="middle" style="">99.2%</text><text x="907.5" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">field accuracy (from 91%)</text><rect x="1045" y="160" width="235" height="100" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="1162.5" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#0d9488" font-weight="bold" text-anchor="middle" style="">-60%</text><text x="1162.5" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">cost per document</text><rect x="1300" y="160" width="250" height="100" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="1425.0" y="206" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="30" fill="#4f46e5" font-weight="bold" text-anchor="middle" style="">80%</text><text x="1425.0" y="232" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle" style="">docs auto-cleared</text><text x="790" y="290" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Field-level extraction accuracy</text><text x="790" y="328" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">Before</text><rect x="910" y="312" width="564.2" height="24" rx="5" fill="#b91c1c"/><text x="1484.2" y="329" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" style="">91%</text><text x="790" y="364" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start" style="">After</text><rect x="910" y="348" width="615.04" height="24" rx="5" fill="#15803d"/><text x="1535.04" y="365" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start" style="">99.2%</text><text x="50" y="450" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start" style="">Solution architecture</text><rect x="50.0" y="470" width="356.25" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/><text x="228.125" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Docs in</text><rect x="431.25" y="470" width="356.25" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/><text x="609.375" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">OCR + schema-enforced extract</text><rect x="812.5" y="470" width="356.25" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/><text x="990.625" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Confidence gate</text><rect x="1193.75" y="470" width="356.25" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/><text x="1371.875" y="535.0" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="middle" style="">Accuracy / regression gate → LOS</text><line x1="406.25" y1="530" x2="431.25" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/><line x1="787.5" y1="530" x2="812.5" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1168.75" y1="530" x2="1193.75" y2="530" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#ah)"/>
